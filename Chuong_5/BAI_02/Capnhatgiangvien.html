<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cập nhật giảng viên</title>
</head>

<body>

<h2>CẬP NHẬT ĐƠN VỊ GIẢNG VIÊN</h2>

<button onclick="capNhat()">Cập nhật</button>

<p id="ketqua"></p>

<script>

function capNhat() {

    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {

        if (this.readyState == 4 && this.status == 200) {

            var xmlDoc = this.responseXML;

            var giangviens =
                xmlDoc.getElementsByTagName("giangvien");

            for (var i = 0; i < giangviens.length; i++) {

                var hoten = giangviens[i]
                    .getElementsByTagName("hoten")[0]
                    .textContent;

                if (hoten == "Phạm Thanh Loan") {

                    giangviens[i]
                        .getElementsByTagName("donvi")[0]
                        .textContent = "Cơ bản";
                }
            }

            document.getElementById("ketqua").innerHTML =
                "Đã cập nhật đơn vị của Phạm Thanh Loan thành Cơ bản.";
        }
    };

    xhttp.open("GET", "hosogiangvien.xml", true);
    xhttp.send();
}

</script>

</body>
</html>
